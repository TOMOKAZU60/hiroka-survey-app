<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable"
content="yes">

<title>現場計算</title>


<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  padding-bottom:90px;

  background:#f3f5f7;

  color:#222;

  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Segoe UI",
  sans-serif;
}


/* ヘッダー */

header{
  position:sticky;

  top:0;

  z-index:20;

  background:
  linear-gradient(135deg,#159be8,#0876ba);

  color:white;

  padding:17px 18px;
}


.header-row{
  display:flex;
  align-items:center;
  gap:12px;
}


.back{
  color:white;

  text-decoration:none;

  font-size:25px;

  font-weight:700;
}


header h1{
  margin:0;

  font-size:22px;
}


header p{
  margin:5px 0 0;

  font-size:12px;

  opacity:.9;
}


main{
  max-width:720px;

  margin:auto;

  padding:16px;
}


/* 計算メニュー */

.calc-menu{
  display:grid;

  grid-template-columns:
  1fr 1fr;

  gap:13px;

  margin-bottom:20px;
}


.calc-menu a{
  min-height:105px;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  padding:13px 8px;

  border-radius:18px;

  color:white;

  text-decoration:none;

  text-align:center;

  font-size:16px;

  font-weight:800;

  box-shadow:
  0 4px 10px rgba(0,0,0,.14);
}


.calc-menu a:nth-child(1){
  background:#168de0;
}

.calc-menu a:nth-child(2){
  background:#17a75c;
}

.calc-menu a:nth-child(3){
  background:#f17a25;
}

.calc-menu a:nth-child(4){
  background:#8b43dc;
}

.calc-menu a:nth-child(5){
  background:#e64b70;
}

.calc-menu a:nth-child(6){
  background:#1ba5a2;
}

.calc-menu a:nth-child(7){
  background:#dca800;
}

.calc-menu a:nth-child(8){
  background:#5867db;
}

.calc-menu a:nth-child(9){
  background:#667581;

  grid-column:1/-1;
}


/* 計算カード */

.card{
  background:white;

  margin-bottom:18px;

  padding:18px;

  border-radius:18px;

  box-shadow:
  0 3px 12px rgba(0,0,0,.09);

  scroll-margin-top:90px;
}


.card h2{
  margin:0 0 14px;

  color:#0877bd;

  font-size:19px;
}


label{
  display:block;

  margin-top:10px;

  font-size:14px;

  font-weight:700;
}


input{
  width:100%;

  margin-top:5px;

  padding:12px;

  border:
  1px solid #c9ced4;

  border-radius:10px;

  font-size:17px;

  background:#fff;
}


button{
  width:100%;

  margin-top:13px;

  padding:13px;

  border:0;

  border-radius:11px;

  background:#087fd0;

  color:#fff;

  font-size:16px;

  font-weight:700;
}


.result{
  min-height:48px;

  margin-top:12px;

  padding:13px;

  background:#eef7ff;

  border-radius:10px;

  white-space:pre-line;

  font-size:15px;

  line-height:1.7;
}


/* 下メニュー */

.bottomnav{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  height:76px;

  display:grid;

  grid-template-columns:
  repeat(4,1fr);

  background:
  rgba(255,255,255,.96);

  border-top:1px solid #ddd;

  backdrop-filter:blur(14px);

  -webkit-backdrop-filter:blur(14px);

  z-index:99;

  padding-bottom:
  env(safe-area-inset-bottom);
}


.bottomnav a{
  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:3px;

  color:#555;

  text-decoration:none;

  font-size:12px;

  font-weight:700;
}


.bottomnav .ico{
  font-size:24px;
}


.bottomnav .active{
  color:#0785d6;
}


@media(max-width:390px){

  main{
    padding:13px;
  }

  .calc-menu{
    gap:10px;
  }

  .calc-menu a{
    min-height:95px;
    font-size:15px;
  }
}

</style>

</head>



<body>


<header>

<div class="header-row">

<a
href="index.html"
class="back">
‹
</a>

<div>

<h1>
現場計算
</h1>

<p>
広川護岸（17工区）工事
</p>

</div>

</div>

</header>



<main>


<!-- 計算選択 -->

<div class="calc-menu">

<a href="#c1">
①<br>2点間距離
</a>

<a href="#c2">
②<br>B点延長
</a>

<a href="#c3">
③<br>円弧半径
</a>

<a href="#c4">
④<br>法面 1：n
</a>

<a href="#c5">
⑤<br>法勾配座標
</a>

<a href="#c6">
⑥<br>高さ→水平距離
</a>

<a href="#c7">
⑦<br>肩→尻
</a>

<a href="#c8">
⑧<br>距離・方向角
</a>

<a href="#c9">
⑨<br>座標オフセット
</a>

</div>



<!-- ① -->

<section
class="card"
id="c1">

<h2>
① 2点間距離
</h2>

<label>A点 X</label>
<input id="c1ax" type="number" step="any">

<label>A点 Y</label>
<input id="c1ay" type="number" step="any">

<label>B点 X</label>
<input id="c1bx" type="number" step="any">

<label>B点 Y</label>
<input id="c1by" type="number" step="any">

<button onclick="calc1()">
計算
</button>

<div
class="result"
id="r1">
</div>

</section>



<!-- ② -->

<section
class="card"
id="c2">

<h2>
② B点延長
</h2>

<label>A点 X</label>
<input id="c2ax" type="number" step="any">

<label>A点 Y</label>
<input id="c2ay" type="number" step="any">

<label>B点 X</label>
<input id="c2bx" type="number" step="any">

<label>B点 Y</label>
<input id="c2by" type="number" step="any">

<label>
B点から延長する距離 (m)
</label>

<input
id="c2d"
type="number"
step="any">

<button onclick="calc2()">
計算
</button>

<div
class="result"
id="r2">
</div>

</section>



<!-- ③ -->

<section
class="card"
id="c3">

<h2>
③ 円弧半径
</h2>

<label>弦長 L (m)</label>

<input
id="c3l"
type="number"
step="any">

<label>矢高 h (m)</label>

<input
id="c3h"
type="number"
step="any">

<button onclick="calc3()">
計算
</button>

<div
class="result"
id="r3">
</div>

</section>



<!-- ④ -->

<section
class="card"
id="c4">

<h2>
④ 法面 1：n
</h2>

<label>高さ H (m)</label>

<input
id="c4h"
type="number"
step="any">

<label>勾配 n</label>

<input
id="c4n"
type="number"
step="any"
value="0.5">

<button onclick="calc4()">
計算
</button>

<div
class="result"
id="r4">
</div>

</section>



<!-- ⑤ -->

<section
class="card"
id="c5">

<h2>
⑤ 法勾配座標
</h2>

<label>基準点 X</label>

<input
id="c5x"
type="number"
step="any">

<label>基準点 Y</label>

<input
id="c5y"
type="number"
step="any">

<label>方向角 (°)</label>

<input
id="c5a"
type="number"
step="any">

<label>高さ H (m)</label>

<input
id="c5h"
type="number"
step="any">

<label>勾配 n</label>

<input
id="c5n"
type="number"
step="any"
value="0.5">

<button onclick="calc5()">
計算
</button>

<div
class="result"
id="r5">
</div>

</section>



<!-- ⑥ -->

<section
class="card"
id="c6">

<h2>
⑥ 高さ → 水平距離
</h2>

<label>高さ H (m)</label>

<input
id="c6h"
type="number"
step="any">

<label>勾配 n</label>

<input
id="c6n"
type="number"
step="any"
value="0.5">

<button onclick="calc6()">
計算
</button>

<div
class="result"
id="r6">
</div>

</section>



<!-- ⑦ -->

<section
class="card"
id="c7">

<h2>
⑦ 肩 → 尻
</h2>

<label>肩 X</label>

<input
id="c7x"
type="number"
step="any">

<label>肩 Y</label>

<input
id="c7y"
type="number"
step="any">

<label>方向角 (°)</label>

<input
id="c7a"
type="number"
step="any">

<label>水平距離 (m)</label>

<input
id="c7d"
type="number"
step="any">

<button onclick="calc7()">
計算
</button>

<div
class="result"
id="r7">
</div>

</section>



<!-- ⑧ -->

<section
class="card"
id="c8">

<h2>
⑧ 距離・方向角
</h2>

<label>A点 X</label>

<input
id="c8ax"
type="number"
step="any">

<label>A点 Y</label>

<input
id="c8ay"
type="number"
step="any">

<label>B点 X</label>

<input
id="c8bx"
type="number"
step="any">

<label>B点 Y</label>

<input
id="c8by"
type="number"
step="any">

<button onclick="calc8()">
計算
</button>

<div
class="result"
id="r8">
</div>

</section>



<!-- ⑨ -->

<section
class="card"
id="c9">

<h2>
⑨ 座標オフセット
</h2>

<label>基準点 X</label>

<input
id="c9x"
type="number"
step="any">

<label>基準点 Y</label>

<input
id="c9y"
type="number"
step="any">

<label>方向角 (°)</label>

<input
id="c9a"
type="number"
step="any">

<label>オフセット距離 (m)</label>

<input
id="c9d"
type="number"
step="any">

<button onclick="calc9()">
計算
</button>

<script>

function num(id){
  return parseFloat(
    document.getElementById(id).value
  );
}


function fmt(v){
  return Number(v).toFixed(3);
}



/* ① */

function calc1(){

  const ax=num("c1ax");
  const ay=num("c1ay");

  const bx=num("c1bx");
  const by=num("c1by");

  const dx=bx-ax;
  const dy=by-ay;

  const d=Math.hypot(dx,dy);

  document.getElementById("r1").innerText=
  "ΔX = "+fmt(dx)+" m\n"+
  "ΔY = "+fmt(dy)+" m\n"+
  "距離 = "+fmt(d)+" m";
}



/* ② */

function calc2(){

  const ax=num("c2ax");
  const ay=num("c2ay");

  const bx=num("c2bx");
  const by=num("c2by");

  const ext=num("c2d");

  const dx=bx-ax;
  const dy=by-ay;

  const len=Math.hypot(dx,dy);

  if(!len){
    return;
  }

  const x=
  bx+(dx/len)*ext;

  const y=
  by+(dy/len)*ext;

  document.getElementById("r2").innerText=
  "新点 X = "+fmt(x)+"\n"+
  "新点 Y = "+fmt(y);
}



/* ③ */

function calc3(){

  const L=num("c3l");
  const h=num("c3h");

  if(!h){
    return;
  }

  const R=
  (L*L)/(8*h)+h/2;

  document.getElementById("r3").innerText=
  "半径 R = "+fmt(R)+" m";
}



/* ④ */

function calc4(){

  const H=num("c4h");
  const n=num("c4n");

  const horizontal=
  H*n;

  const slope=
  Math.hypot(H,horizontal);

  document.getElementById("r4").innerText=
  "水平距離 = "+
  fmt(horizontal)+" m\n"+
  "法長 = "+
  fmt(slope)+" m";
}



/* ⑤
   測量方向角
   北 = 0°
   東 = 90°
*/

function calc5(){

  const x=num("c5x");
  const y=num("c5y");

  const angle=num("c5a");

  const H=num("c5h");
  const n=num("c5n");

  const d=
  H*n;

  const rad=
  angle*Math.PI/180;

  const nx=
  x+d*Math.cos(rad);

  const ny=
  y+d*Math.sin(rad);

  document.getElementById("r5").innerText=
  "水平距離 = "+
  fmt(d)+" m\n"+
  "新点 X = "+
  fmt(nx)+"\n"+
  "新点 Y = "+
  fmt(ny);
}



/* ⑥ */

function calc6(){

  const H=num("c6h");
  const n=num("c6n");

  const d=
  H*n;

  document.getElementById("r6").innerText=
  "水平距離 = "+
  fmt(d)+" m";
}



/* ⑦ */

function calc7(){

  const x=num("c7x");
  const y=num("c7y");

  const angle=num("c7a");
  const d=num("c7d");

  const rad=
  angle*Math.PI/180;

  const nx=
  x+d*Math.cos(rad);

  const ny=
  y+d*Math.sin(rad);

  document.getElementById("r7").innerText=
  "尻 X = "+
  fmt(nx)+"\n"+
  "尻 Y = "+
  fmt(ny);
}



/* ⑧ */

function calc8(){

  const ax=num("c8ax");
  const ay=num("c8ay");

  const bx=num("c8bx");
  const by=num("c8by");

  const dx=bx-ax;
  const dy=by-ay;

  const distance=
  Math.hypot(dx,dy);

  let angle=
  Math.atan2(dy,dx)
  *180/Math.PI;

  if(angle<0){
    angle+=360;
  }

  document.getElementById("r8").innerText=
  "距離 = "+
  fmt(distance)+" m\n"+
  "方向角 = "+
  fmt(angle)+"°";
}



/* ⑨ */

function calc9(){

  const x=num("c9x");
  const y=num("c9y");

  const angle=num("c9a");
  const d=num("c9d");

  const rad=
  angle*Math.PI/180;

  const nx=
  x+d*Math.cos(rad);

  const ny=
  y+d*Math.sin(rad);

  document.getElementById("r9").innerText=
  "新点 X = "+
  fmt(nx)+"\n"+
  "新点 Y = "+
  fmt(ny);
}

</script>


</body>
