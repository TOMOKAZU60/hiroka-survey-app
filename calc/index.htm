<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable"
content="yes">

<title>現場計算｜広川護岸</title>


<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding-bottom:90px;

  background:#f3f5f7;
  color:#222;

  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Segoe UI",
  sans-serif;
}


/* ===== ヘッダー ===== */

header{
  background:
  linear-gradient(135deg,#159be8,#0876ba);

  color:white;

  padding:18px;
}


.header-row{
  display:flex;
  align-items:center;
  gap:14px;
}


.back{
  display:flex;

  width:42px;
  height:42px;

  align-items:center;
  justify-content:center;

  border-radius:12px;

  background:
  rgba(255,255,255,.18);

  color:white;

  text-decoration:none;

  font-size:30px;
  font-weight:600;
}


header h1{
  margin:0;
  font-size:23px;
}


header p{
  margin:4px 0 0;
  font-size:12px;
  opacity:.9;
}


/* ===== メイン ===== */

main{
  max-width:720px;
  margin:auto;
  padding:18px;
}


.title{
  margin:3px 0 16px;

  font-size:14px;
  color:#666;
}


/* ===== 計算メニュー ===== */

.calc-menu{
  display:grid;

  grid-template-columns:
  1fr 1fr;

  gap:14px;
}


.calc-btn{
  min-height:130px;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:7px;

  padding:14px 8px;

  border-radius:20px;

  color:white;

  text-decoration:none;
  text-align:center;

  font-size:17px;
  font-weight:800;

  box-shadow:
  0 4px 11px rgba(0,0,0,.15);

  -webkit-tap-highlight-color:
  transparent;
}


.calc-btn:active{
  transform:scale(.97);
}


.number{
  font-size:29px;
  line-height:1;
}


.calc-btn small{
  font-size:11px;
  font-weight:600;
  opacity:.88;
}


/* ボタン色 */

.c1{
  background:
  linear-gradient(145deg,#36a7ff,#087be0);
}

.c2{
  background:
  linear-gradient(145deg,#35cf76,#08a84c);
}

.c3{
  background:
  linear-gradient(145deg,#ff9a47,#ff6f19);
}

.c4{
  background:
  linear-gradient(145deg,#b45cff,#7d26dc);
}

.c5{
  background:
  linear-gradient(145deg,#ff6686,#e73661);
}

.c6{
  background:
  linear-gradient(145deg,#39c8c4,#159b9a);
}

.c7{
  background:
  linear-gradient(145deg,#ffd34f,#e7a900);
}

.c8{
  background:
  linear-gradient(145deg,#6f82ff,#4a55d8);
}

.c9{
  background:
  linear-gradient(145deg,#8e9ba8,#64717e);

  grid-column:1/-1;
}


/* ===== 下部ナビ ===== */

.bottomnav{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  height:76px;

  display:grid;
  grid-template-columns:repeat(4,1fr);

  background:
  rgba(255,255,255,.96);

  border-top:1px solid #ddd;

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);

  z-index:99;

  padding-bottom:
  env(safe-area-inset-bottom);
}


.bottomnav a{
  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:3px;

  color:#555;

  text-decoration:none;

  font-size:12px;
  font-weight:700;
}


.bottomnav .ico{
  font-size:24px;
}


.bottomnav .active{
  color:#0785d6;
}


/* ===== iPhone ===== */

@media(max-width:390px){

  main{
    padding:14px;
  }

  .calc-menu{
    gap:11px;
  }

  .calc-btn{
    min-height:115px;
    font-size:16px;
  }

  .number{
    font-size:27px;
  }
}

</style>

</head>


<body>


<header>

<div class="header-row">


<a
href="../index.html"
class="back">

‹

<div>

現場計算
</h1>

<p>
広川護岸（17工区）工事
</p>

</div>


</div>

</header>



<main>


<div class="title">
使用する計算を選択してください
</div>



<div class="calc-menu">


<a
href="c1.html"
class="calc-btn c1">

<span class="number">①</span>

<span>2点間距離</span>

<small>
座標から距離を計算
</small>

</a>



<a
href="c2.html"
class="calc-btn c2">

<span class="number">②</span>

<span>B点延長</span>

<small>
A→B方向へ延長
</small>

</a>



<a
href="c3.html"
class="calc-btn c3">

<span class="number">③</span>

<span>円弧半径</span>

<small>
弦長・矢高から計算
</small>

</a>



<a
href="c4.html"
class="calc-btn c4">

<span class="number">④</span>

<span>法面 1：n</span>

<small>
高さ・勾配計算
</small>

</a>



<a
href="c5.html"
class="calc-btn c5">

<span class="number">⑤</span>

<span>法勾配座標</span>

<small>
法面位置を座標化
</small>

</a>



<a
href="c6.html"
class="calc-btn c6">

<span class="number">⑥</span>

<span>高さ→水平距離</span>

<small>
高さと勾配から計算
</small>

</a>



<a
href="c7.html"
class="calc-btn c7">

<span class="number">⑦</span>

<span>肩→尻</span>

<small>
法尻位置を計算
</small>

</a>



<a
href="c8.html"
class="calc-btn c8">

<span class="number">⑧</span>

<span>距離・方向角</span>

<small>
2点の座標から計算
</small>

</a>



<a
href="c9.html"
class="calc-btn c9">

<span class="number">⑨</span>

<span>座標オフセット</span>

<small>
基準座標から新点を計算
</small>

</a>


</div>


</main>



<nav class="bottomnav">


<a href="../index.html">

<span class="ico">🏠</span>
<span>ホーム</span>

</a>



<a
href="index.html"
class="active">

<span class="ico">🧮</span>
<span>計算</span>

</a>

</body>
</html>
