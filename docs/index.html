<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>施工資料</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:#f2f4f7;
  color:#222;
}

header{
  background:#1769aa;
  color:white;
  text-align:center;
  padding:20px 15px;
}

header h1{
  margin:0;
  font-size:22px;
}

header p{
  margin:6px 0 0;
  font-size:13px;
  opacity:.9;
}

main{
  max-width:600px;
  margin:auto;
  padding:18px 14px 30px;
}

.menu-btn{
  display:flex;
  align-items:center;
  gap:14px;

  width:100%;
  min-height:76px;

  margin-bottom:14px;
  padding:16px 18px;

  background:white;
  color:#222;

  text-decoration:none;

  border-radius:14px;

  box-shadow:
    0 2px 8px rgba(0,0,0,.12);

  font-size:17px;
  font-weight:600;

  transition:.15s;
}

.menu-btn:active{
  transform:scale(.98);
  background:#e9eef3;
}

.icon{
  font-size:30px;
  flex-shrink:0;
}

.text{
  flex:1;
}

.sub{
  display:block;
  margin-top:4px;

  font-size:12px;
  font-weight:400;

  color:#777;
}

.back-btn{
  display:block;

  margin-top:25px;
  padding:15px;

  text-align:center;

  background:#e1e5e9;
  color:#333;

  text-decoration:none;

  border-radius:12px;

  font-size:15px;
  font-weight:600;
}

footer{
  text-align:center;
  color:#888;
  font-size:11px;
  padding:5px 10px 25px;
}

</style>
</head>

<body>

<header>
  <h1>施工資料</h1>
  <p>広川護岸（17工区）工事</p>
</header>

<main>

  <a
    href="../data/土木工事施工管理の手引き.pdf"
    class="menu-btn"
  >
    <span class="icon">📘</span>

    <span class="text">
      土木工事施工管理の手引き
      <span class="sub">PDFを表示</span>
    </span>
  </a>


  <a
    href="../data/土木工事共通仕様書.pdf"
    class="menu-btn"
  >
    <span class="icon">📗</span>

    <span class="text">
      土木工事共通仕様書
      <span class="sub">PDFを表示</span>
    </span>
  </a>


  <a href="../" class="back-btn">
    ← ホームへ戻る
  </a>

</main>

<footer>
  広川護岸（17工区）工事
</footer>

</body>
</html>
