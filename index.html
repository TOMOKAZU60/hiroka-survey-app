<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>広川護岸 現場計算</title>

<style>
*{box-sizing:border-box}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  margin:0;
  background:#f2f4f7;
  color:#222;
}

header{
  background:#1769aa;
  color:#fff;
  padding:18px 12px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:22px;
}

header p{
  margin:5px 0 0;
  font-size:12px;
}

main{
  max-width:600px;
  margin:auto;
  padding:10px;
}

.card{
  background:#fff;
  margin-bottom:14px;
  padding:16px;
  border-radius:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

h2{
  margin:0 0 12px;
  font-size:18px;
  color:#1769aa;
}

label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-top:9px;
}

input,select{
  width:100%;
  padding:11px;
  margin-top:4px;
  border:1px solid #bbb;
  border-radius:9px;
  font-size:16px;
  background:#fff;
}

button,.linkbtn{
  display:block;
  width:100%;
  padding:12px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  background:#1769aa;
  color:#fff;
  font-size:16px;
  font-weight:600;
  text-align:center;
  text-decoration:none;
  cursor:pointer;
}

.copy{
  background:#16835d;
}

.clear{
  background:#777;
}

.sitebox{
  background:#16835d;
}

.dropbox{
  background:#0866ff;
}

.result{
  margin-top:12px;
  padding:12px;
  background:#eef6ff;
  border-radius:9px;
  white-space:pre-line;
  font-size:15px;
  line-height:1.7;
  min-height:45px;
}

.home-photo{
  width:100%;
  display:block;
  border-radius:12px;
  margin-bottom:12px;
}

.quick{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.quick a{
  padding:11px 5px;
  background:#e8f1fa;
  color:#1769aa;
  border-radius:9px;
  text-align:center;
  text-decoration:none;
  font-size:13px;
  font-weight:600;
}

footer{
  text-align:center;
  font-size:11px;
  color:#777;
  padding:15px;
}
</style>
</head>

<body>

<header>
<h1>広川護岸 現場計算</h1>
<p>測量・施工管理 計算ツール</p>
</header>

<main>

<!-- HOME -->
<section class="card">
<h2>🏠 HOME</h2>

<img src="home.jpg" class="home-photo" alt="広川護岸">

<div class="quick">
<a href="#c1">① 2点間距離</a>
<a href="#c2">② B点延長</a>
<a href="#c3">③ 指定距離座標</a>
<a href="#c4">④ 円弧半径</a>
<a href="#c5">⑤ 縮尺</a>
<a href="#c6">⑥ 高低差</a>
<a href="#c7">⑦ 法勾配</a>
<a href="#c8">⑧ 法勾配座標</a>
<a href="#c9">⑨ 土量</a>
</div>

<a class="linkbtn sitebox"
href="shortcuts://run-shortcut?name=SiteBox%E3%82%92%E9%96%8B%E3%81%8F">
📱 SiteBoxを開く
</a>

<a class="linkbtn dropbox"
href="https://www.dropbox.com/"
target="_blank">
📁 Dropboxを開く
</a>

</section>


<!-- ① -->
<section class="card" id="c1">
<h2>① 2点間距離</h2>

<label>A点 X</label>
<input id="x1" type="number" step="any">

<label>A点 Y</label>
<input id="y1" type="number" step="any">

<label>B点 X</label>
<input id="x2" type="number" step="any">

<label>B点 Y</label>
<input id="y2" type="number" step="any">

<button onclick="calc1()">計算</button>
<div class="result" id="r1"></div>
<button class="copy" onclick="copyResult('r1')">結果をコピー</button>
<button class="clear" onclick="clearCard('c1')">入力をクリア</button>
</section>


<!-- ② -->
<section class="card" id="c2">
<h2>② A→B方向 B点から延長</h2>

<label>A点 X</label>
<input id="a2x" type="number" step="any">

<label>A点 Y</label>
<input id="a2y" type="number" step="any">

<label>B点 X</label>
<input id="b2x" type="number" step="any">

<label>B点 Y</label>
<input id="b2y" type="number" step="any">

<label>B点からの延長距離 (m)</label>
<input id="d2" type="number" step="any">

<button onclick="calc2()">計算</button>
<div class="result" id="r2"></div>
<button class="copy" onclick="copyResult('r2')">結果をコピー</button>
<button class="clear" onclick="clearCard('c2')">入力をクリア</button>
</section>


<!-- ③ -->
<section class="card" id="c3">
<h2>③ A→B方向 指定距離の座標</h2>

<label>A点 X</label>
<input id="a3x" type="number" step="any">

<label>A点 Y</label>
<input id="a3y" type="number" step="any">

<label>B点 X</label>
<input id="b3x" type="number" step="any">

<label>B点 Y</label>
<input id="b3y" type="number" step="any">

<label>A点からの距離 (m)</label>
<input id="d3" type="number" step="any">

<button onclick="calc3()">計算</button>
<div class="result" id="r3"></div>
<button class="copy" onclick="copyResult('r3')">結果をコピー</button>
<button class="clear" onclick="clearCard('c3')">入力をクリア</button>
</section>


<!-- ④ -->
<section class="card" id="c4">
<h2>④ 円弧半径</h2>

<label>弦長 L (m)</label>
<input id="l4" type="number" step="any">

<label>矢高 h (m)</label>
<input id="h4" type="number" step="any">

<button onclick="calc4()">計算</button>
<div class="result" id="r4"></div>
<button class="copy" onclick="copyResult('r4')">結果をコピー</button>
<button class="clear" onclick="clearCard('c4')">入力をクリア</button>
</section>


<!-- ⑤ -->
<section class="card" id="c5">
<h2>⑤ 縮尺換算</h2>

<label>元の寸法</label>
<input id="v5" type="number" step="any">

<label>元の縮尺 1：</label>
<input id="s51" type="number" step="any" value="100">

<label>変更後の縮尺 1：</label>
<input id="s52" type="number" step="any" value="20">

<button onclick="calc5()">計算</button>
<div class="result" id="r5"></div>
<button class="copy" onclick="copyResult('r5')">結果をコピー</button>
<button class="clear" onclick="clearCard('c5')">入力をクリア</button>
</section>


<!-- ⑥ -->
<section class="card" id="c6">
<h2>⑥ 高低差・標高</h2>

<label>基準標高 (m)</label>
<input id="e6" type="number" step="any">

<label>高低差 (m)</label>
<input id="dh6" type="number" step="any">

<select id="pm6">
<option value="1">＋ 上がる</option>
<option value="-1">－ 下がる</option>
</select>

<button onclick="calc6()">計算</button>
<div class="result" id="r6"></div>
<button class="copy" onclick="copyResult('r6')">結果をコピー</button>
<button class="clear" onclick="clearCard('c6')">入力をクリア</button>
</section>


<!-- ⑦ -->
<section class="card" id="c7">
<h2>⑦ 法勾配 1：n 計算</h2>

<label>高さ H (m)</label>
<input id="h7" type="number" step="any">

<label>勾配 n</label>
<input id="n7" type="number" step="any" value="0.5">

<button onclick="calc7()">計算</button>
<div class="result" id="r7"></div>
<button class="copy" onclick="copyResult('r7')">結果をコピー</button>
<button class="clear" onclick="clearCard('c7')">入力をクリア</button>
</section>


<!-- ⑧ -->
<section class="card" id="c8">
<h2>⑧ 法勾配の座標計算</h2>

<label>基準点 X</label>
<input id="x8" type="number" step="any">

<label>基準点 Y</label>
<input id="y8" type="number" step="any">

<label>方向角 (°)</label>
<input id="ang8" type="number" step="any">

<label>高さ H (m)</label>
<input id="h8" type="number" step="any">

<label>勾配 n</label>
<input id="n8" type="number" step="any" value="0.5">

<button onclick="calc8()">計算</button>
<div class="result" id="r8"></div>
<button class="copy" onclick="copyResult('r8')">結果をコピー</button>
<button class="clear" onclick="clearCard('c8')">入力をクリア</button>
</section>


<!-- ⑨ -->
<section class="card" id="c9">
<h2>⑨ 平均断面法 土量計算</h2>

<label>断面積 A1 (㎡)</label>
<input id="a91" type="number" step="any">

<label>断面積 A2 (㎡)</label>
<input id="a92" type="number" step="any">

<label>区間距離 L (m)</label>
<input id="l9" type="number" step="any">

<button onclick="calc9()">計算</button>
<div class="result" id="r9"></div>
<button class="copy" onclick="copyResult('r9')">結果をコピー</button>
<button class="clear" onclick="clearCard('c9')">入力をクリア</button>
</section>

</main>

<footer>
広川護岸（17工区）工事／現場計算ツール
</footer>


<script>

function n(id){
  return parseFloat(document.getElementById(id).value);
}

function valid(){
  return [...arguments].every(Number.isFinite);
}

function f(v){
  return Number(v).toFixed(3);
}


/* ① */
function calc1(){
  let ax=n("x1"), ay=n("y1");
  let bx=n("x2"), by=n("y2");

  if(!valid(ax,ay,bx,by)) return;

  let dx=bx-ax;
  let dy=by-ay;
  let d=Math.hypot(dx,dy);

  document.getElementById("r1").innerText =
  "ΔX = "+f(dx)+" m\n"+
  "ΔY = "+f(dy)+" m\n"+
  "水平距離 = "+f(d)+" m";
}


/* ② */
function calc2(){
  let ax=n("a2x"),ay=n("a2y");
  let bx=n("b2x"),by=n("b2y");
  let ext=n("d2");

  if(!valid(ax,ay,bx,by,ext)) return;

  let dx=bx-ax;
  let dy=by-ay;
  let d=Math.hypot(dx,dy);

  if(d===0) return;

  let x=bx+(dx/d)*ext;
  let y=by+(dy/d)*ext;

  document.getElementById("r2").innerText =
  "新点 X = "+f(x)+"\n"+
  "新点 Y = "+f(y);
}


/* ③ */
function calc3(){
  let ax=n("a3x"),ay=n("a3y");
  let bx=n("b3x"),by=n("b3y");
  let dist=n("d3");

  if(!valid(ax,ay,bx,by,dist)) return;

  let dx=bx-ax;
  let dy=by-ay;
  let d=Math.hypot(dx,dy);

  if(d===0) return;

  let x=ax+(dx/d)*dist;
  let y=ay+(dy/d)*dist;

  document.getElementById("r3").innerText =
  "新点 X = "+f(x)+"\n"+
  "新点 Y = "+f(y);
}


/* ④ */
function calc4(){
  let L=n("l4");
  let h=n("h4");

  if(!valid(L,h) || h===0) return;

  let R=(L*L)/(8*h)+h/2;

  document.getElementById("r4").innerText =
  "半径 R = "+f(R)+" m";
}


/* ⑤ */
function calc5(){
  let value=n("v5");
  let from=n("s51");
  let to=n("s52");

  if(!valid(value,from,to) || from===0 || to===0) return;

  let ans=value*from/to;

  document.getElementById("r5").innerText =
  "換算後 = "+f(ans);
}


/* ⑥ */
function calc6(){
  let elevation=n("e6");
  let diff=n("dh6");
  let pm=n("pm6");

  if(!valid(elevation,diff,pm)) return;

  let ans=elevation+(diff*pm);

  document.getElementById("r6").innerText =
  "標高 = "+f(ans)+" m";
}


/* ⑦ */
function calc7(){
  let H=n("h7");
  let slope=n("n7");

  if(!valid(H,slope)) return;

  let horizontal=H*slope;
  let length=Math.hypot(H,horizontal);

  document.getElementById("r7").innerText =
  "高さ H = "+f(H)+" m\n"+
  "勾配 = 1："+slope+"\n"+
  "水平距離 = "+f(horizontal)+" m\n"+
  "法長 = "+f(length)+" m";
}


/* ⑧ */
function calc8(){
  let x=n("x8");
  let y=n("y8");
  let angle=n("ang8");
  let H=n("h8");
  let slope=n("n8");

  if(!valid(x,y,angle,H,slope)) return;

  let horizontal=H*slope;
  let rad=angle*Math.PI/180;

  let nx=x+horizontal*Math.cos(rad);
  let ny=y+horizontal*Math.sin(rad);

  let length=Math.hypot(H,horizontal);

  document.getElementById("r8").innerText =
  "水平距離 = "+f(horizontal)+" m\n"+
  "法長 = "+f(length)+" m\n"+
  "新点 X = "+f(nx)+"\n"+
  "新点 Y = "+f(ny);
}


/* ⑨ */
function calc9(){
  let A1=n("a91");
  let A2=n("a92");
  let L=n("l9");

  if(!valid(A1,A2,L)) return;

  let average=(A1+A2)/2;
  let volume=average*L;

  document.getElementById("r9").innerText =
  "平均断面積 = "+f(average)+" ㎡\n"+
  "土量 = "+f(volume)+" ㎥";
}


/* コピー */
function copyResult(id){
  let text=document.getElementById(id).innerText;

  if(!text) return;

  navigator.clipboard.writeText(text)
  .then(()=>alert("結果をコピーしました"));
}


/* クリア */
function clearCard(id){
  let card=document.getElementById(id);

  card.querySelectorAll("input").forEach(el=>{
    el.value="";
  });

  card.querySelectorAll(".result").forEach(el=>{
    el.innerText="";
  });
}

</script>

</body>
</html>
