<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>広川護岸（17工区）工事</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding-bottom:88px;
  background:#f3f5f7;
  color:#222;

  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Segoe UI",
  sans-serif;
}


/* ヘッダー */

header{
  background:linear-gradient(135deg,#149be8,#0876ba);
  color:#fff;
  padding:22px 22px 18px;
}

header h1{
  margin:0;
  font-size:25px;
  font-weight:800;
}

header p{
  margin:7px 0 0;
  font-size:14px;
  opacity:.92;
}


/* メイン */

main{
  max-width:720px;
  margin:auto;
}


/* HOME写真 */

.home-photo{
  display:block;
  width:100%;
  height:auto;
}


/* HOMEメニュー */

.home-menu{
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:16px;

  padding:20px 18px;
}


/* 大ボタン */

.home-btn{
  min-height:155px;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:10px;

  border-radius:23px;

  color:#fff;

  text-decoration:none;
  text-align:center;

  font-size:22px;
  font-weight:800;

  box-shadow:
  0 5px 14px rgba(0,0,0,.17);

  -webkit-tap-highlight-color:transparent;

  transition:
  transform .08s ease,
  opacity .08s ease;
}


.home-btn:active{
  transform:scale(.97);
  opacity:.9;
}


/* アイコン */

.home-btn .icon{
  font-size:43px;
  line-height:1;
}


/* 計算 */

.calc{
  background:
  linear-gradient(145deg,#36a7ff,#087be0);
}


/* SiteBox */

.sitebox{
  background:
  linear-gradient(145deg,#38c77c,#079e4c);
}


/* 数量表 */

.quantity{
  background:
  linear-gradient(145deg,#ff9d49,#f36b19);
}


/* 図面 */

.drawing{
  background:
  linear-gradient(145deg,#a75cff,#712bd1);
}


/* 補足文字 */

.home-btn small{
  font-size:12px;
  font-weight:600;
  opacity:.9;
}


/* 下部ナビ */

.bottomnav{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  height:76px;

  display:grid;
  grid-template-columns:repeat(4,1fr);

  background:
  rgba(255,255,255,.96);

  border-top:1px solid #ddd;

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);

  z-index:99;

  padding-bottom:
  env(safe-area-inset-bottom);
}


.bottomnav a{
  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:3px;

  color:#555;

  text-decoration:none;

  font-size:12px;
  font-weight:700;
}


.bottomnav .ico{
  font-size:24px;
}


.bottomnav .active{
  color:#0785d6;
}


/* フッター */

footer{
  padding:5px 15px 20px;

  text-align:center;

  color:#888;

  font-size:11px;
}


/* iPhone */

@media(max-width:390px){

  header h1{
    font-size:22px;
  }

  .home-menu{
    gap:13px;
    padding:16px 14px;
  }

  .home-btn{
    min-height:140px;
    font-size:20px;
  }

  .home-btn .icon{
    font-size:39px;
  }
}

</style>
</head>


<body>


<header>

<footer>

</html>
