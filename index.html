<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>広川護岸 現場計算</title>

<style>
*{
  box-sizing:border-box;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  margin:0;
  background:#f2f4f7;
  color:#222;
}

header{
  background:#1769aa;
  color:white;
  padding:18px 12px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:22px;
}

header p{
  margin:5px 0 0;
  font-size:12px;
}

main{
  max-width:600px;
  margin:auto;
  padding:10px;
}

.home-photo{
  width:100%;
  max-height:260px;
  object-fit:cover;
  border-radius:14px;
  margin-bottom:12px;
  display:block;
}

.card{
  background:white;
  margin-bottom:14px;
  padding:16px;
  border-radius:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

h2{
  margin:0 0 12px;
  font-size:18px;
  color:#1769aa;
}

label{
  display:block;
  font-size:13px;
  margin-top:8px;
  margin-bottom:3px;
}

input, select{
  width:100%;
  padding:11px;
  font-size:16px;
  border:1px solid #ccc;
  border-radius:8px;
}

button{
  width:100%;
  padding:12px;
  margin-top:12px;
  border:none;
  border-radius:9px;
  background:#1769aa;
  color:white;
  font-size:16px;
  font-weight:bold;
}

button:active{
  opacity:.75;
}

.result{
  margin-top:12px;
  padding:11px;
  background:#eef6ff;
  border-radius:8px;
  font-weight:bold;
  line-height:1.7;
  min-height:44px;
}

.dropbox-btn{
  display:block;
  width:100%;
  padding:15px;
  text-align:center;
  text-decoration:none;
  background:#0061ff;
  color:white;
  font-size:17px;
  font-weight:bold;
  border-radius:10px;
}

.small{
  font-size:12px;
  color:#666;
  margin-top:8px;
}

footer{
  text-align:center;
  color:#777;
  font-size:11px;
  padding:15px;
}
</style>
</head>

<body>

<header>
  <h1>広川護岸 現場計算</h1>
  <p>広川護岸（17工区）工事</p>
</header>

<main>

<!-- HOME写真 -->
<div class="card">
  <h2>🏠 HOME</h2>
  <img src="home.jpg" class="home-photo" alt="広川護岸 現場写真">
</div>

<!-- Dropbox -->
<div class="card">
  <h2>📁 現場資料</h2>

  <a class="dropbox-btn"
     href="https://www.dropbox.com/scl/fo/4i1p7fb9tooc2cxtqnims/AENxaFyKAfMlWDOA3_MXpgg?rlkey=n0mpdedb5bdbtu6xt49u2ksqk&st=z7zpty0b&dl=0"
     target="_blank"
     rel="noopener">
     📁 Dropboxを開く
  </a>

  <div class="small">
    広川護岸（17工区）工事フォルダ
  </div>
</div>

<!-- ① 2点間距離 -->
<div class="card">
<h2>① 2点間距離</h2>

<label>A点 X</label>
<input id="x1" type="number" step="any">

<label>A点 Y</label>
<input id="y1" type="number" step="any">

<label>B点 X</label>
<input id="x2" type="number" step="any">

<label>B点 Y</label>
<input id="y2" type="number" step="any">

<button onclick="distanceCalc()">計算</button>

<div id="distanceResult" class="result"></div>
</div>


<!-- ② A→B 延長座標 -->
<div class="card">
<h2>② A→B 延長座標</h2>

<label>A点 X</label>
<input id="ax" type="number" step="any">

<label>A点 Y</label>
<input id="ay" type="number" step="any">

<label>B点 X</label>
<input id="bx" type="number" step="any">

<label>B点 Y</label>
<input id="by" type="number" step="any">

<label>B点から延長する距離（m）</label>
<input id="ext" type="number" step="any">

<button onclick="extensionCalc()">計算</button>

<div id="extensionResult" class="result"></div>
</div>


<!-- ③ A点からB方向へ -->
<div class="card">
<h2>③ A点からB方向へ指定距離</h2>

<label>A点 X</label>
<input id="a3x" type="number" step="any">

<label>A点 Y</label>
<input id="a3y" type="number" step="any">

<label>B点 X</label>
<input id="b3x" type="number" step="any">

<label>B点 Y</label>
<input id="b3y" type="number" step="any">

<label>A点からの距離（m）</label>
<input id="d3" type="number" step="any">

<button onclick="pointFromA()">計算</button>

<div id="pointAResult" class="result"></div>
</div>


<!-- ④ 円弧半径 -->
<div class="card">
<h2>④ 円弧半径</h2>

<label>弦長 L（m）</label>
<input id="chord" type="number" step="any">

<label>矢高 h（m）</label>
<input id="sagitta" type="number" step="any">

<button onclick="radiusCalc()">計算</button>

<div id="radiusResult" class="result"></div>
</div>


<!-- ⑤ 縮尺換算 -->
<div class="card">
<h2>⑤ 縮尺換算</h2>

<label>元の寸法</label>
<input id="scaleValue" type="number" step="any">

<label>元の縮尺 1 /</label>
<input id="scaleFrom" type="number" step="any">

<label>変更後の縮尺 1 /</label>
<input id="scaleTo" type="number" step="any">

<button onclick="scaleCalc()">計算</button>

<div id="scaleResult" class="result"></div>
</div>


<!-- ⑥ 高低差 -->
<div class="card">
<h2>⑥ 高低差・標高計算</h2>

<label>基準標高（m）</label>
<input id="elevation" type="number" step="any">

<label>高低差（m）</label>
<input id="heightDifference" type="number" step="any">

<select id="heightDirection">
<option value="plus">上げる ＋</option>
<option value="minus">下げる −</option>
</select>

<button onclick="heightCalc()">計算</button>

<div id="heightResult" class="result"></div>
</div>


<!-- ⑦ 法勾配 -->
<div class="card">
<h2>⑦ 法勾配計算</h2>

<label>高さ H（m）</label>
<input id="slopeHeight" type="number" step="any">

<label>法勾配 1 : n</label>
<input id="slopeN" type="number" step="any" value="0.5">

<button onclick="slopeCalc()">計算</button>

<div id="slopeResult" class="result"></div>
</div>


<!-- ⑧ 法勾配座標 -->
<div class="card">
<h2>⑧ 法勾配 座標計算</h2>

<label>基準点 X</label>
<input id="slopeX" type="number" step="any">

<label>基準点 Y</label>
<input id="slopeY" type="number" step="any">

<label>高さ H（m）</label>
<input id="slopeCoordH" type="number" step="any">

<label>法勾配 1 : n</label>
<input id="slopeCoordN" type="number" step="any" value="0.5">

<label>方向角（度）</label>
<input id="slopeAngle" type="number" step="any">

<button onclick="slopeCoordinate()">計算</button>

<div id="slopeCoordinateResult" class="result"></div>
</div>


<!-- ⑨ 面積・土量 -->
<div class="card">
<h2>⑨ 平均断面法 土量計算</h2>

<label>断面積 A1（㎡）</label>
<input id="area1" type="number" step="any">

<label>断面積 A2（㎡）</label>
<input id="area2" type="number" step="any">

<label>測点間距離 L（m）</label>
<input id="sectionLength" type="number" step="any">

<button onclick="volumeCalc()">計算</button>

<div id="volumeResult" class="result"></div>
</div>

</main>

<footer>
広川護岸（17工区）工事　現場計算ツール
</footer>


<script>

function n(id){
  return parseFloat(document.getElementById(id).value);
}

function valid(){
  for(let i=0;i<arguments.length;i++){
    if(!Number.isFinite(arguments[i])) return false;
  }
  return true;
}

/* ① 距離 */
function distanceCalc(){

  const x1=n("x1");
  const y1=n("y1");
  const x2=n("x2");
  const y2=n("y2");

  if(!valid(x1,y1,x2,y2)){
    document.getElementById("distanceResult").innerHTML="数値を入力してください";
    return;
  }

  const d=Math.hypot(x2-x1,y2-y1);

  document.getElementById("distanceResult").innerHTML=
  "距離 = "+d.toFixed(3)+" m";
}


/* ② B点から延長 */
function extensionCalc(){

  const ax=n("ax");
  const ay=n("ay");
  const bx=n("bx");
  const by=n("by");
  const ext=n("ext");

  if(!valid(ax,ay,bx,by,ext)){
    document.getElementById("extensionResult").innerHTML="数値を入力してください";
    return;
  }

  const dx=bx-ax;
  const dy=by-ay;
  const len=Math.hypot(dx,dy);

  if(len===0){
    document.getElementById("extensionResult").innerHTML="A点とB点が同じです";
    return;
  }

  const cx=bx+(dx/len)*ext;
  const cy=by+(dy/len)*ext;

  document.getElementById("extensionResult").innerHTML=
  "新点 X = "+cx.toFixed(3)+"<br>"+
  "新点 Y = "+cy.toFixed(3);
}


/* ③ AからB方向 */
function pointFromA(){

  const ax=n("a3x");
  const ay=n("a3y");
  const bx=n("b3x");
  const by=n("b3y");
  const dist=n("d3");

  if(!valid(ax,ay,bx,by,dist)){
    document.getElementById("pointAResult").innerHTML="数値を入力してください";
    return;
  }

  const dx=bx-ax;
  const dy=by-ay;
  const len=Math.hypot(dx,dy);

  if(len===0){
    document.getElementById("pointAResult").innerHTML="A点とB点が同じです";
    return;
  }

  const x=ax+(dx/len)*dist;
  const y=ay+(dy/len)*dist;

  document.getElementById("pointAResult").innerHTML=
  "新点 X = "+x.toFixed(3)+"<br>"+
  "新点 Y = "+y.toFixed(3);
}


/* ④ 円弧半径 */
function radiusCalc(){

  const L=n("chord");
  const h=n("sagitta");

  if(!valid(L,h) || L<=0 || h<=0){
    document.getElementById("radiusResult").innerHTML=
    "弦長と矢高を正しく入力してください";
    return;
  }

  const R=(L*L)/(8*h)+h/2;

  document.getElementById("radiusResult").innerHTML=
  "半径 R = "+R.toFixed(3)+" m";
}


/* ⑤ 縮尺 */
function scaleCalc(){

  const value=n("scaleValue");
  const from=n("scaleFrom");
  const to=n("scaleTo");

  if(!valid(value,from,to) || from<=0 || to<=0){
    document.getElementById("scaleResult").innerHTML="数値を確認してください";
    return;
  }

  const answer=value*(from/to);

  document.getElementById("scaleResult").innerHTML=
  "変更後 = "+answer.toFixed(3);
}


/* ⑥ 高さ */
function heightCalc(){

  const elevation=n("elevation");
  const diff=n("heightDifference");

  if(!valid(elevation,diff)){
    document.getElementById("heightResult").innerHTML="数値を入力してください";
    return;
  }

  const direction=document.getElementById("heightDirection").value;

  const result=
  direction==="plus"
  ? elevation+diff
  : elevation-diff;

  document.getElementById("heightResult").innerHTML=
  "標高 = "+result.toFixed(3)+" m";
}


/* ⑦ 法勾配 */
function slopeCalc(){

  const H=n("slopeHeight");
  const N=n("slopeN");

  if(!valid(H,N) || H<0 || N<0){
    document.getElementById("slopeResult").innerHTML="数値を確認してください";
    return;
  }

  const horizontal=H*N;
  const slopeLength=Math.hypot(H,horizontal);

  document.getElementById("slopeResult").innerHTML=
  "水平距離 = "+horizontal.toFixed(3)+" m<br>"+
  "法長 = "+slopeLength.toFixed(3)+" m";
}


/* ⑧ 法勾配座標 */
function slopeCoordinate(){

  const x=n("slopeX");
  const y=n("slopeY");
  const H=n("slopeCoordH");
  const N=n("slopeCoordN");
  const angle=n("slopeAngle");

  if(!valid(x,y,H,N,angle)){
    document.getElementById("slopeCoordinateResult").innerHTML=
    "数値を入力してください";
    return;
  }

  const horizontal=H*N;
  const rad=angle*Math.PI/180;

  const nx=x+horizontal*Math.cos(rad);
  const ny=y+horizontal*Math.sin(rad);

  document.getElementById("slopeCoordinateResult").innerHTML=
  "水平距離 = "+horizontal.toFixed(3)+" m<br>"+
  "新点 X = "+nx.toFixed(3)+"<br>"+
  "新点 Y = "+ny.toFixed(3);
}


/* ⑨ 平均断面法 */
function volumeCalc(){

  const A1=n("area1");
  const A2=n("area2");
  const L=n("sectionLength");

  if(!valid(A1,A2,L) || A1<0 || A2<0 || L<0){
    document.getElementById("volumeResult").innerHTML="数値を確認してください";
    return;
  }

  const V=((A1+A2)/2)*L;

  document.getElementById("volumeResult").innerHTML=
  "土量 = "+V.toFixed(3)+" ㎥";
}

</script>

</body>
</html>
