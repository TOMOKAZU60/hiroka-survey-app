<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>広川護岸（17工区）工事</title>

<style>

*{
  box-sizing:border-box;
}

html{
  -webkit-text-size-adjust:100%;
}

body{
  margin:0;
  padding:0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;

  background:#f2f4f7;
  color:#222;
}


/* ===== ヘッダー ===== */

header{
  background:#1769aa;
  color:#fff;
  text-align:center;

  padding:
    calc(16px + env(safe-area-inset-top))
    12px
    17px;
}

header h1{
  margin:0;
  font-size:22px;
  font-weight:700;
}

header p{
  margin:6px 0 0;
  font-size:12px;
  opacity:.9;
}


/* ===== メイン ===== */

main{
  width:100%;
  max-width:600px;

  margin:0 auto;

  padding:
    14px
    12px
    calc(30px + env(safe-area-inset-bottom));
}


/* ===== HOME写真 ===== */

.home-photo{
  width:100%;
  margin-bottom:16px;

  background:#fff;

  border-radius:15px;
  overflow:hidden;

  box-shadow:
    0 2px 10px rgba(0,0,0,.13);
}

.home-photo img{
  display:block;

  width:100%;
  height:auto;

  max-height:300px;

  object-fit:cover;
}


/* ===== メニュー ===== */

.menu{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.menu-btn{
  display:flex;
  align-items:center;

  width:100%;
  min-height:72px;

  padding:14px 17px;

  background:#fff;
  color:#222;

  text-decoration:none;

  border-radius:14px;

  box-shadow:
    0 2px 8px rgba(0,0,0,.12);

  -webkit-tap-highlight-color:transparent;
}

.menu-btn:active{
  transform:scale(.98);
  background:#e9eef3;
}


/* ===== アイコン ===== */

.icon{
  display:flex;
  align-items:center;
  justify-content:center;

  width:48px;

  flex-shrink:0;

  font-size:30px;
}


/* ===== 文字 ===== */

.menu-text{
  flex:1;

  padding-left:8px;

  font-size:18px;
  font-weight:700;
}

.menu-sub{
  display:block;

  margin-top:3px;

  font-size:11px;
  font-weight:400;

  color:#777;
}


/* ===== 矢印 ===== */

.arrow{
  padding-left:8px;

  color:#999;

  font-size:22px;
}


/* ===== フッター ===== */

footer{
  margin-top:24px;

  text-align:center;

  color:#888;

  font-size:11px;
}


/* ===== 小さいiPhone ===== */

@media(max-width:380px){

  header h1{
    font-size:20px;
  }

  .menu-btn{
    min-height:68px;
  }

  .menu-text{
    font-size:17px;
  }

  .icon{
    width:43px;
    font-size:27px;
  }

}

</style>
</head>


<body>


<header>

  <h1>広川護岸（17工区）工事</h1>

  <p>現場管理ポータル</p>

  >

</div>



<div class="menu">


<!-- 現場計算 -->

  <span class="menu-text">

      座標・勾配・距離など
    </span>
  </span>

  <span class="arrow">›</span>

<!-- 施工資料 -->

<a href="./docs/" class="menu-btn">

  <span class="icon">📚</span>

  <span class="menu-text">

    <span class="menu-sub">
      施工管理の手引き・共通仕様書
    </span>
  </span>

  <span class="arrow">›</span>

</a>



<!-- SiteBox -->

<a href="sitebox://" class="menu-btn">

  <span class="icon">📱</span>

  <span class="menu-text">
    SiteBox

    <span class="menu-sub">
      現場写真・電子黒板
    </span>
  </span>

  <span class="arrow">›</span>

<!-- 数量表 -->

<a href="./data/金入.pdf" class="menu-btn">

  <span class="icon">📊</span>

  <span class="menu-text">
    数量表

    <span class="menu-sub">

  </span>

  <span class="arrow">›</span>

</a>



<!-- 図面 -->

  <span class="icon">📐</span>

    <span class="menu-sub">
      工事図面
    </span>
  </span>

</div>

  広川護岸（17工区）工事

</html>
