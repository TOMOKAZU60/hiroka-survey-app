<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>広川護岸（17工区）工事</title>

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  padding-bottom:90px;
  background:#f4f6f8;
  color:#222;

  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Segoe UI",
  sans-serif;
}


/* =========================
   ヘッダー
========================= */

header{
  background:linear-gradient(#1597e4,#0877bd);
  color:white;
  padding:24px 28px 18px;
}

header h1{
  margin:0;
  font-size:25px;
  font-weight:800;
}

header p{
  margin:10px 0 0;
  font-size:15px;
}

main{
  max-width:720px;
  margin:auto;
}


/* =========================
   HOME写真
========================= */

.home-photo{
  display:block;
  width:100%;
  height:auto;
}


/* =========================
   ①〜⑨ 計算メニュー
========================= */

.quick{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  padding:18px;
}

.quick a{
  min-height:150px;
  padding:22px 12px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:22px;

  color:white;
  text-decoration:none;
  text-align:center;

  font-size:21px;
  font-weight:800;

  box-shadow:
  0 5px 12px rgba(0,0,0,.18);

  -webkit-tap-highlight-color:transparent;
}


/* ① */
.quick a:nth-child(1){
  background:
  linear-gradient(145deg,#36a7ff,#087be0);
}


/* ② */
.quick a:nth-child(2){
  background:
  linear-gradient(145deg,#35cf76,#08a84c);
}


/* ③ */
.quick a:nth-child(3){
  background:
  linear-gradient(145deg,#ff9a47,#ff6f19);
}


/* ④ */
.quick a:nth-child(4){
  background:
  linear-gradient(145deg,#b45cff,#7d26dc);
}


/* ⑤ */
.quick a:nth-child(5){
  background:
  linear-gradient(145deg,#ff6686,#e73661);
}


/* ⑥ */
.quick a:nth-child(6){
  background:
  linear-gradient(145deg,#39c8c4,#159b9a);
}


/* ⑦ */
.quick a:nth-child(7){
  background:
  linear-gradient(145deg,#ffd34f,#e7a900);
}


/* ⑧ */
.quick a:nth-child(8){
  background:
  linear-gradient(145deg,#6f82ff,#4a55d8);
}


/* ⑨ */
.quick a:nth-child(9){
  background:
  linear-gradient(145deg,#8e9ba8,#64717e);

  grid-column:1/-1;
}


/* =========================
   設定・アプリ
========================= */

.card{
  background:white;

  margin:0 18px 18px;
  padding:18px;

  border-radius:18px;

  box-shadow:
  0 3px 12px rgba(0,0,0,.10);
}

.card h2{
  margin:0 0 14px;

  color:#0877bd;
  font-size:20px;
}


/* 共通ボタン */

.linkbtn{
  display:flex;

  width:100%;
  min-height:58px;

  margin-top:12px;
  padding:13px 15px;

  align-items:center;
  justify-content:center;

  border-radius:13px;

  color:white;
  text-align:center;
  text-decoration:none;

  font-size:16px;
  font-weight:700;

  box-shadow:
  0 3px 8px rgba(0,0,0,.13);

  -webkit-tap-highlight-color:transparent;
}


/* SiteBox */

.sitebox{
  background:
  linear-gradient(145deg,#28a86f,#16835d);
}


/* 数量表 */

.document{
  background:
  linear-gradient(145deg,#2f9d62,#217346);
}


/* 図面 */

.drawing{
  background:
  linear-gradient(145deg,#6f82ff,#4a55d8);
}


/* =========================
   下部メニュー
========================= */

.bottomnav{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  height:76px;

  display:grid;
  grid-template-columns:repeat(5,1fr);

  background:
  rgba(255,255,255,.96);

  border-top:
  1px solid #ddd;

  backdrop-filter:
  blur(14px);

  -webkit-backdrop-filter:
  blur(14px);

  z-index:99;

  padding-bottom:
  env(safe-area-inset-bottom);
}


.bottomnav a{
  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:3px;

  color:#333;

  text-decoration:none;

  font-size:12px;
  font-weight:700;

  -webkit-tap-highlight-color:
  transparent;
}


.bottomnav .ico{
  font-size:25px;
}


.bottomnav .active{
  color:#0785d6;
}


/* =========================
   フッター
========================= */

footer{
  padding:15px;

  text-align:center;

  color:#777;

  font-size:11px;
}


/* =========================
   iPhone小画面
========================= */

@media(max-width:390px){

  header h1{
    font-size:22px;
  }

  header p{
    font-size:13px;
  }

  .quick{
    gap:12px;
    padding:14px;
  }

  .quick a{
    min-height:132px;
    font-size:19px;
  }

  .card{
    margin-left:14px;
    margin-right:14px;
  }
}

</style>
</head>
