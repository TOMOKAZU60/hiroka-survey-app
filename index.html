<!DOCTYPE html>
<html lang="ja">
<head>

content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>広川護岸（17工区）工事</title>

<style>

/* =========================
   基本設定
========================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;

  background:#f4f5f7;
  color:#333;
  padding-bottom:105px;
}


/* =========================
   ヘッダー
========================= */

header{
  background:linear-gradient(135deg,#18a8e8,#078bcf);
  color:#fff;
  padding:
    calc(22px + env(safe-area-inset-top))
    30px
    25px;
}

.header-title{
  font-size:29px;
  font-weight:800;
  letter-spacing:.5px;
  margin:0;
}

.header-sub{
  margin-top:8px;
  font-size:16px;
  opacity:.85;
}


/* =========================
   HOME写真
========================= */

.hero{
  width:100%;
  background:#ddd;
  overflow:hidden;
}

.hero img{
  width:100%;
  height:180px;
  display:block;
  object-fit:cover;
}


/* =========================
   メイン
========================= */

main{
  padding:27px 31px 30px;
  max-width:760px;
  margin:0 auto;
}

.section-title{
  font-size:21px;
  font-weight:700;
  color:#555;
  margin:0 0 26px;
}


/* =========================
   カード配置
========================= */

.menu-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:24px 25px;
}


/* =========================
   共通カード
========================= */

.menu-card{
  min-height:205px;

  border-radius:30px;

  text-decoration:none;
  color:#fff;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-align:center;

  padding:22px 12px;

  box-shadow:
    0 10px 20px rgba(0,0,0,.15);

  transition:
    transform .12s ease,
    opacity .12s ease;
}

.menu-card:active{
  transform:scale(.96);
  opacity:.9;
}


/* =========================
   アイコン
========================= */

.menu-icon{
  font-size:43px;
  line-height:1;
  margin-bottom:16px;
}


/* =========================
   カード文字
========================= */

.menu-title{
  font-size:24px;
  font-weight:800;
  line-height:1.25;
}

.menu-desc{
  font-size:15px;
  font-weight:600;
  margin-top:13px;
  opacity:.9;
  line-height:1.4;
}


/* =========================
   カードカラー
========================= */

.blue{
  background:linear-gradient(135deg,#35b5ff,#087eea);
}

.green{
  background:linear-gradient(135deg,#36d77a,#0eb54e);
}

.orange{
  background:linear-gradient(135deg,#ffa33b,#ff6b20);
}

.purple{
  background:linear-gradient(135deg,#bc4cff,#8520dc);
}

.pink{
  background:linear-gradient(135deg,#ff527e,#ec2860);
}

.teal{
  background:linear-gradient(135deg,#40caca,#13a5a6);
}

.yellow{
  background:linear-gradient(135deg,#ffd44b,#ffb900);
}

.indigo{
  background:linear-gradient(135deg,#7182ff,#4d5de5);
}


/* =========================
   下部固定ナビ
========================= */

.bottom-nav{

  position:fixed;

  left:0;
  right:0;
  bottom:0;

  height:
    calc(86px + env(safe-area-inset-bottom));

  padding-bottom:
    env(safe-area-inset-bottom);

  background:rgba(255,255,255,.97);

  border-top:1px solid #ddd;

  display:grid;
  grid-template-columns:repeat(4,1fr);

  z-index:1000;

  box-shadow:
    0 -2px 12px rgba(0,0,0,.05);
}

.nav-item{

  text-decoration:none;

  color:#555;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  font-size:15px;
  font-weight:700;
}

.nav-icon{
  font-size:29px;
  margin-bottom:5px;
}

.nav-item.active{
  color:#159ad9;
}


/* =========================
   iPhone小画面
========================= */

@media(max-width:430px){

  header{
    padding-left:20px;
    padding-right:20px;
  }

  .header-title{
    font-size:25px;
  }

  .hero img{
    height:155px;
  }

  main{
    padding-left:18px;
    padding-right:18px;
  }

  .menu-grid{
    gap:16px;
  }

  .menu-card{
    min-height:175px;
    border-radius:25px;
  }

  .menu-icon{
    font-size:37px;
    margin-bottom:13px;
  }

  .menu-title{
    font-size:20px;
  }

  .menu-desc{
    font-size:13px;
  }

}

</style>
</head>
